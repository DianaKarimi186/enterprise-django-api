<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Enterprise Inventory</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-6"
>

    <div class="w-full max-w-md">

        <div
            class="bg-gray-800 border border-gray-700 rounded-xl p-8 shadow-2xl"
        >

            <!-- Header -->

            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-emerald-400">
                    Enterprise Inventory
                </h1>

                <p class="text-gray-400 mt-2">
                    Sign in to your account
                </p>

            </div>


            <!-- Messages -->

            <div
                id="message"
                class="mb-4"
            ></div>


            <!-- Login Form -->

            <form
                id="login-form"
                class="space-y-5"
            >

                <!-- Username -->

                <div>

                    <label
                        class="block text-sm text-gray-400 mb-2"
                        for="username"
                    >
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        required
                        autocomplete="username"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500"
                        placeholder="Enter username"
                    >

                </div>


                <!-- Password -->

                <div>

                    <label
                        class="block text-sm text-gray-400 mb-2"
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500"
                        placeholder="Enter password"
                    >

                </div>


                <!-- Submit -->

                <button
                    id="login-button"
                    type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition"
                >
                    Sign In
                </button>

            </form>


            <!-- Register -->

            <p class="text-center text-gray-400 text-sm mt-6">

                Don't have an account?

                <a
                    href="/register/"
                    class="text-emerald-400 hover:text-emerald-300"
                >
                    Create one
                </a>

            </p>

        </div>

    </div>


    <script>

        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("login-button");


        function getCookie(name) {

            const cookies = document.cookie.split(";");

            for (let cookie of cookies) {

                cookie = cookie.trim();

                if (cookie.startsWith(name + "=")) {

                    return decodeURIComponent(
                        cookie.substring(name.length + 1)
                    );

                }

            }

            return null;
        }


        function showMessage(
            text,
            type = "error"
        ) {

            if (type === "success") {

                message.innerHTML = `
                    <div
                        class="bg-emerald-900/50
                               border border-emerald-700
                               text-emerald-300
                               rounded-lg
                               p-3
                               text-sm"
                    >
                        ${text}
                    </div>
                `;

            } else {

                message.innerHTML = `
                    <div
                        class="bg-red-900/50
                               border border-red-700
                               text-red-300
                               rounded-lg
                               p-3
                               text-sm"
                    >
                        ${text}
                    </div>
                `;

            }

        }


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const csrfToken =
                    getCookie("csrftoken");


                loginButton.disabled = true;

                loginButton.textContent = "Signing in...";

                message.innerHTML = "";


                try {

                    /*
                     * STEP 1
                     *
                     * Authenticate with JWT.
                     *
                     * These tokens are used by the API and
                     * HTMX requests on the dashboard.
                     */

                    const jwtResponse = await fetch(
                        "/api/accounts/login/",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",

                                "X-CSRFToken": csrfToken
                            },

                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );


                    const jwtData =
                        await jwtResponse.json();


                    if (!jwtResponse.ok) {

                        showMessage(
                            "Invalid username or password."
                        );

                        return;
                    }


                    /*
                     * STEP 2
                     *
                     * Store JWT tokens.
                     */

                    sessionStorage.setItem(
                        "access_token",
                        jwtData.access
                    );

                    sessionStorage.setItem(
                        "refresh_token",
                        jwtData.refresh
                    );


                    /*
                     * STEP 3
                     *
                     * Create Django browser session.
                     */

                    const sessionResponse =
                        await fetch(
                            "/api/accounts/browser-login/",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded",

                                    "X-CSRFToken":
                                        csrfToken
                                },

                                body:
                                    new URLSearchParams({
                                        username: username,
                                        password: password
                                    })
                            }
                        );


                    const sessionData =
                        await sessionResponse.json();


                    if (!sessionResponse.ok) {

                        sessionStorage.removeItem(
                            "access_token"
                        );

                        sessionStorage.removeItem(
                            "refresh_token"
                        );

                        showMessage(
                            sessionData.message ||
                            "Unable to create login session."
                        );

                        return;
                    }


                    /*
                     * STEP 4
                     *
                     * Everything succeeded.
                     */

                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "/api/products/dashboard/";

                        },
                        500
                    );

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    sessionStorage.removeItem(
                        "access_token"
                    );

                    sessionStorage.removeItem(
                        "refresh_token"
                    );


                    showMessage(
                        "Unable to connect to the server."
                    );

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent = "Sign In";

                }

            }
        );

    </script>

</body>
</html>
